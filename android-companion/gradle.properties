org.gradle.jvmargs=-Xmx2048m
# Robolectric — the render capture — pulls androidx.test:monitor, and AGP refuses a
# test classpath holding AndroidX while this flag is false. No AndroidX artifact
# reaches the APK: the flag only guards the test runtime, which is why it lives
# here and not in the app's own dependencies.
android.useAndroidX=true
android.nonTransitiveRClass=true
