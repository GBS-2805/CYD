plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.phonedesk.companion'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.phonedesk.companion'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// The Flash tab ships the deck sketch inside the APK. Copying it at build time
// keeps cyd_phone_deck/cyd_phone_deck.ino the single source of truth instead of
// duplicating 2,000 lines into assets.
tasks.register("syncDeckSketch", Copy) {
    from("${rootDir}/../cyd_phone_deck") {
        include "cyd_phone_deck.ino"
    }
    into("${projectDir}/src/main/assets/deck")
}

afterEvaluate {
    tasks.named("preBuild").configure {
        dependsOn("syncDeckSketch")
    }
}
