plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.phonedesk.companion'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.phonedesk.companion'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// The Flash tab ships this repo's sketches inside the APK. Copying them at build
// time keeps each project folder the single source of truth instead of
// duplicating thousands of lines into assets.
//
// Adding a project: put its folder name here. The sketch inside it is
// expected at <folder>/<folder>.ino and lands in assets/deck under that same
// name, which is what FlashLibrary lists and what the toolchain checks against
// the repo file of the same name.
def bundledProjects = ["cyd_phone_deck"]

tasks.register("syncBundledSketches", Copy) {
    // assets/deck is generated output. Copy alone never deletes, so a project
    // removed from the list would keep shipping its sketch forever.
    doFirst {
        delete("${projectDir}/src/main/assets/deck")
    }
    bundledProjects.each { name ->
        from("${rootDir}/../${name}") {
            include "${name}.ino"
        }
    }
    into("${projectDir}/src/main/assets/deck")
}

afterEvaluate {
    tasks.named("preBuild").configure {
        dependsOn("syncBundledSketches")
    }
}
