plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.phonedesk.companion'
    // 35 is what a store listing requires for a new app, and it is also the
    // release that forces edge-to-edge windows; MainActivity.applySystemBarInsets
    // is what keeps the header out from under the status bar on Android 15.
    compileSdk 35

    defaultConfig {
        applicationId 'dev.phonedesk.companion'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Robolectric draws the app's own views with Android's own renderer, so it
        // needs the merged manifest and the real resources, not just the bytecode.
        unitTests {
            includeAndroidResources = true
        }
    }

    buildTypes {
        debug {
            // Private builds only. A debuggable APK lets any machine with adb
            // attach to the process that holds notification access, which is the
            // one component here that reads message text. The APK stays
            // debug-signed; this only removes the debugger.
            debuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Each project folder carries a widget.json descriptor naming its sketch. This
// task copies the descriptor and the sketch it names into
// app/src/main/assets/widgets/<id>/, which is what WidgetCatalog reads at runtime
// and what toolchain.sh reads back out of the built APK.
//
// Adding a project: drop a folder beside this one holding its .ino and a
// widget.json naming both. Nothing in this file needs to change.
def widgetFiles = fileTree(rootDir.parentFile) {
    include "*/widget.json"
    exclude "android-companion/**"
    exclude "**/build/**"
}

tasks.register("syncWidgets") {
    def out = layout.projectDirectory.dir("src/main/assets/widgets").asFile
    inputs.files(widgetFiles)
    // A descriptor only names its sketch, so the sketch is not covered by the
    // line above. Declared explicitly, because the output lives in
    // src/main/assets, which `clean` does not delete: without the .ino as an
    // input, editing the sketch alone left this task UP-TO-DATE and a full
    // rebuild shipped the previous copy while toolchain.sh caught the drift.
    inputs.files(widgetFiles.files.collect { descriptor ->
        def meta = new groovy.json.JsonSlurper().parse(descriptor)
        new File(descriptor.parentFile, meta.sketch ?: "${descriptor.parentFile.name}.ino")
    })
    outputs.dir(out)
    doLast {
        // assets/widgets is generated output. Copy alone never deletes, so a
        // widget removed from the repo would keep shipping forever.
        delete out
        def parsed = new groovy.json.JsonSlurper()
        widgetFiles.files.sort { it.path }.each { descriptor ->
            def meta = parsed.parse(descriptor)
            def id = meta.id
            if (!id) throw new GradleException("${descriptor}: widget.json needs an id")
            def sketchName = meta.sketch ?: "${descriptor.parentFile.name}.ino"
            def sketch = new File(descriptor.parentFile, sketchName)
            if (!sketch.isFile()) throw new GradleException("${descriptor}: ${sketchName} not found")
            def dest = new File(out, id)
            dest.mkdirs()
            new File(dest, "widget.json").bytes = descriptor.bytes
            new File(dest, sketchName).bytes = sketch.bytes
        }
    }
}

afterEvaluate {
    tasks.named("preBuild").configure { dependsOn("syncWidgets") }
}

tasks.withType(Test).configureEach {
    outputs.upToDateWhen { false }
}

dependencies {
    // The capture: the app's real screens, drawn by the platform's own graphics
    // stack on the JVM, so a render is a picture of the app rather than a redraw.
    // The capture test writes PNGs as a side effect, so Gradle's up-to-date check cannot
    // see that app/build/capture was deleted and skips the run entirely (exit 0, zero
    // frames). The old answer was --rerun-tasks, which also re-runs every compile: 21 s to
    // redraw seven screens whose code had not changed. Declaring the test tasks never
    // current costs nothing — they take seconds — and leaves every other task's caching.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
